<html lang="en">

  <meta charset="UTF-8" />

  <title>Admin Portal — Tiger Soul</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/logo/favicon-32.png" />

  <style>
    :root{
      --forest:#15271c; --forest-800:#203829; --ink:#232219; --ink-soft:#565046;
      --gold:#c6a769; --gold-deep:#a3813f; --line:#e7e0d0; --paper:#fffdf8; --cream:#f6f1e7;
      --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; background:#ece5d6; font-family:var(--sans); color:var(--ink); }
    a{ color:var(--gold-deep); }

    /* Login / gate screen */
    .gate{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .gate-card{ max-width:440px; width:100%; background:var(--paper); border:1px solid var(--line);
      border-radius:18px; overflow:hidden; box-shadow:0 40px 90px -55px rgba(15,28,20,.55); text-align:center; }
    .gate-banner{ background:var(--forest) url("../assets/images/waiver-banner.png") center/cover no-repeat; padding:2rem 1rem; }
    .gate-banner img{ height:120px; }
    .gate-body{ padding:2rem 2rem 2.4rem; }
    .gate-body h1{ font-family:var(--serif); font-weight:600; color:var(--forest-800); font-size:1.8rem; margin:0 0 .3rem; }
    .gate-body p{ color:var(--ink-soft); font-size:.95rem; margin:0 0 1.5rem; }
    .btn{ display:inline-flex; align-items:center; gap:.6em; justify-content:center; cursor:pointer;
      border:none; border-radius:999px; padding:.9em 1.8em; font-family:var(--sans); font-size:.8rem;
      font-weight:500; letter-spacing:.14em; text-transform:uppercase; background:var(--gold); color:var(--forest);
      transition:background .3s ease, color .3s ease; text-decoration:none; }
    .btn:hover{ background:var(--gold-deep); color:#fff; }
    .btn--ghost{ background:transparent; border:1px solid rgba(21,21,15,.2); color:var(--ink-soft); }
    .muted{ color:var(--ink-soft); }
    .err{ color:#b4462f; font-size:.9rem; margin-top:1rem; }
    .gate-input{ width:100%; padding:.85em 1em; border:1px solid var(--line); border-radius:10px;
      font-family:var(--sans); font-size:1rem; }
    .gate-input:focus{ outline:none; border-color:var(--gold-deep); box-shadow:0 0 0 3px rgba(163,129,63,.15); }
    .sent{ color:var(--gold-deep); font-size:.95rem; line-height:1.5; }

    /* App */
    .app{ display:none; min-height:100vh; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:1rem;
      background:var(--forest); color:var(--cream); padding:.9rem 1.4rem; }
    .topbar .brand{ font-family:var(--serif); font-size:1.3rem; color:var(--gold); letter-spacing:.02em; }
    .topbar .who{ font-size:.8rem; color:rgba(246,241,231,.75); display:flex; align-items:center; gap:1rem; }
    .topbar .btn--ghost{ color:rgba(246,241,231,.85); border-color:rgba(246,241,231,.3); padding:.5em 1.1em; font-size:.68rem; }

    .layout{ display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - 58px); }
    @media (max-width:760px){ .layout{ grid-template-columns:1fr; } .detail{ border-left:none; } .list{ max-height:40vh; } }

    .list{ border-right:1px solid var(--line); background:var(--paper); overflow:auto; }
    .list-head{ padding:1rem 1.1rem .6rem; position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line); }
    .list-head input{ width:100%; padding:.7em .9em; border:1px solid var(--line); border-radius:10px; font-family:var(--sans); font-size:.9rem; }
    .list-head .count{ font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); margin-top:.6rem; display:block; }
    .client{ padding:.85rem 1.1rem; border-bottom:1px solid var(--line); cursor:pointer; }
    .client:hover{ background:var(--cream); }
    .client.active{ background:#efe8d6; box-shadow:inset 3px 0 0 var(--gold); }
    .client .nm{ font-family:var(--serif); font-size:1.15rem; color:var(--forest-800); }
    .client .em{ font-size:.8rem; color:var(--ink-soft); }

    .detail{ padding:clamp(1.2rem,3vw,2.2rem); overflow:auto; }
    .detail .empty{ color:var(--ink-soft); text-align:center; margin-top:20vh; }
    .p-name{ font-family:var(--serif); font-weight:600; color:var(--forest-800); font-size:2rem; margin:0 0 .2rem; }
    .p-meta{ color:var(--ink-soft); font-size:.95rem; margin:0 0 1.4rem; }
    .p-meta a{ color:var(--gold-deep); }
    .card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:1.3rem 1.4rem; margin-bottom:1.3rem; }
    .card h3{ font-family:var(--serif); color:var(--forest-800); font-size:1.3rem; margin:0 0 .8rem; }
    .lbl{ font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep); margin:0 0 .3rem; }
    textarea{ width:100%; min-height:130px; padding:.85em 1em; border:1px solid var(--line); border-radius:10px;
      font-family:var(--sans); font-size:.95rem; resize:vertical; }
    .notes-row{ display:flex; align-items:center; gap:1rem; margin-top:.7rem; }
    .notes-row .saved{ font-size:.82rem; color:var(--gold-deep); }
    .sig{ max-width:340px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .kv{ display:grid; grid-template-columns:180px 1fr; gap:.4rem 1rem; }
    .kv dt{ font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-deep); padding-top:.35rem; }
    .kv dd{ margin:0; font-size:.95rem; color:var(--ink); border-bottom:1px solid var(--line); padding:.35rem 0; }
    .tag{ display:inline-block; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep);
      border:1px solid var(--line); border-radius:999px; padding:.25em .8em; }
    details.qa{ border-top:1px solid var(--line); }
    details.qa summary{ cursor:pointer; padding:.6rem 0; font-family:var(--serif); font-size:1.05rem; color:var(--forest-800); }
    .qline{ padding:.4rem 0 .6rem 1rem; }
    .qline .q{ font-size:.85rem; color:var(--ink-soft); }
    .qline .a{ font-size:.95rem; color:var(--ink); }

    /* Dashboard */
    .dash-head{ font-family:var(--serif); font-weight:600; color:var(--forest-800); font-size:2rem; margin:0 0 1.2rem; }
    .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
    @media (max-width:820px){ .tiles{ grid-template-columns:repeat(2,1fr); } }
    .tile{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.2rem;
      cursor:pointer; transition:border-color .2s ease, transform .2s ease; }
    .tile:hover{ border-color:var(--gold-deep); transform:translateY(-2px); }
    .tile.warn{ border-color:#e6c98f; box-shadow:inset 0 0 0 1px #eccf9a; }
    .tile .tnum{ font-family:var(--serif); font-size:2.4rem; line-height:1; color:var(--forest-800); }
    .tile .tlbl{ font-family:var(--sans); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); margin-top:.5rem; }
    .dash-h{ font-family:var(--serif); font-weight:600; color:var(--forest-800); font-size:1.4rem; margin:1.8rem 0 .9rem; }
    .prog-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; }
    @media (max-width:820px){ .prog-grid{ grid-template-columns:1fr; } }
    .prog-card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:1.2rem 1.3rem; }
    .prog-name{ font-family:var(--serif); font-size:1.25rem; color:var(--forest-800); }
    .prog-count{ font-family:var(--sans); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); margin:.2rem 0 .8rem; }
    .chips{ display:flex; flex-wrap:wrap; gap:.4rem; }
    .chip{ border:1px solid var(--line); background:var(--cream); border-radius:999px; padding:.3em .8em; font-family:var(--sans);
      font-size:.82rem; color:var(--ink); cursor:pointer; }
    .chip:hover{ border-color:var(--gold-deep); }
    /* Program roster */
    .prog-card.click{ cursor:pointer; transition:border-color .2s ease, transform .2s ease; }
    .prog-card.click:hover{ border-color:var(--gold-deep); transform:translateY(-2px); }
    .prog-dates{ font-size:.86rem; color:var(--ink-soft); margin:.15rem 0 .7rem; line-height:1.6; }
    .prog-dates span{ display:block; }
    .prog-head-dates{ font-family:var(--serif); font-size:1.25rem; color:var(--gold-deep); margin:0 0 .6rem; line-height:1.5; }
    .prog-open{ font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); margin-top:.8rem; display:block; }
    .ro{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:.9rem 1.1rem; margin-bottom:.7rem; }
    .ro-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .ro-name{ font-family:var(--serif); font-size:1.2rem; color:var(--forest-800); cursor:pointer; }
    .ro-name:hover{ color:var(--gold-deep); }
    .ro-mail{ font-size:.82rem; color:var(--ink-soft); margin-top:.1rem; }
    .ro-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; margin-top:.9rem; }
    @media (max-width:1020px){ .ro-grid{ grid-template-columns:repeat(2,1fr); } }
    @media (max-width:560px){ .ro-grid{ grid-template-columns:1fr; } }
    .ro-foot{ display:flex; align-items:flex-end; gap:.7rem; flex-wrap:wrap; margin-top:.8rem; }
    .ro-foot .btn, .ro-foot .icon-btn{ padding:.55em 1.1em; font-size:.68rem; }
    .fld{ display:flex; flex-direction:column; gap:.28rem; }
    .fld label{ font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); }
    .fld input, .fld select{ width:100%; padding:.55em .7em; border:1px solid var(--line); border-radius:9px;
      font-family:var(--sans); font-size:.88rem; background:#fff; color:var(--ink); }
    .fld input:focus, .fld select:focus{ outline:none; border-color:var(--gold-deep); box-shadow:0 0 0 3px rgba(163,129,63,.15); }
    .fld .hint{ text-transform:none; letter-spacing:0; color:var(--ink-soft); font-size:.68rem; }
    .flash{ font-size:.74rem; color:#3c5a3c; padding-bottom:.5rem; }
    .flash.bad{ color:#b4462f; }
    .date-row{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:.7rem; align-items:end;
      padding:.8rem 0; border-bottom:1px solid var(--line); }
    @media (max-width:900px){ .date-row{ grid-template-columns:1fr 1fr; } }
    .miss-list{ display:flex; flex-direction:column; gap:.5rem; }
    .miss-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; width:100%; text-align:left;
      background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:.75rem 1rem; cursor:pointer; }
    .miss-row:hover{ border-color:var(--gold-deep); }
    .miss-row .nm{ font-family:var(--serif); font-size:1.1rem; color:var(--forest-800); }
    .mtag{ font-family:var(--sans); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:#a8541f;
      background:#f6e9d8; border-radius:999px; padding:.25em .7em; margin-left:.4rem; }
    .back{ display:inline-block; font-family:var(--sans); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
      color:var(--gold-deep); cursor:pointer; margin-bottom:1rem; border-bottom:1px solid rgba(163,129,63,.4); }
    .rec-head{ display:flex; align-items:center; gap:.8rem; margin:0 0 .8rem; }
    .rec-head h3{ margin:0; }
    .badge{ font-family:var(--sans); font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; padding:.35em .85em; border-radius:999px; font-weight:500; }
    .badge--ok{ background:#e2efdd; color:#3c5a3c; }
    .badge--no{ background:#f6e9d8; color:#a8541f; }
    .rec-actions{ margin:1.1rem 0 .3rem; display:flex; gap:.6rem; flex-wrap:wrap; }
    .rec-actions .btn{ padding:.7em 1.5em; font-size:.7rem; }
    .btn--danger{ background:#c2492f; color:#fff; }
    .btn--danger:hover{ background:#a53d27; color:#fff; }
    .del-client{ display:inline-block; margin-top:1.6rem; background:none; border:1px solid #e0b3a5; color:#a53d27;
      padding:.65em 1.4em; border-radius:999px; font-family:var(--sans); font-size:.68rem; letter-spacing:.14em;
      text-transform:uppercase; cursor:pointer; }
    .del-client:hover{ background:#f7e9e4; }

    /* Campaigns */
    .camp-input{ width:100%; padding:.8em 1em; border:1px solid var(--line); border-radius:10px;
      font-family:var(--sans); font-size:1rem; background:#fff; }
    .camp-input:focus, textarea:focus{ outline:none; border-color:var(--gold-deep); box-shadow:0 0 0 3px rgba(163,129,63,.15); }
    .camp-note{ font-size:.85rem; color:var(--ink-soft); margin:.2rem 0 0; }
    .camp-actions{ display:flex; gap:.7rem; flex-wrap:wrap; align-items:center; margin-top:1rem; }
    .camp-status{ font-size:.9rem; }
    .camp-status.ok{ color:#3c5a3c; } .camp-status.bad{ color:#b4462f; }
    .dash-head-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin:0 0 1.2rem; }
    .dash-head-row .dash-head{ margin:0; }
    /* campaign list */
    .camp-row{ display:flex; align-items:center; justify-content:space-between; gap:1rem; width:100%;
      background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:.9rem 1.1rem; margin-bottom:.6rem; cursor:pointer; }
    .camp-row:hover{ border-color:var(--gold-deep); }
    .camp-row .cn{ font-family:var(--serif); font-size:1.2rem; color:var(--forest-800); }
    .camp-row .cs{ font-size:.82rem; color:var(--ink-soft); margin-top:.15rem; }
    .camp-row .cright{ display:flex; align-items:center; gap:.5rem; white-space:nowrap; }
    .st{ font-family:var(--sans); font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; padding:.35em .8em; border-radius:999px; font-weight:500; }
    .st--draft{ background:#efe8d6; color:#8a6d2b; }
    .st--scheduled{ background:#e3ecf2; color:#3a5a75; }
    .st--sent{ background:#e2efdd; color:#3c5a3c; }
    .st--sending{ background:#f6e9d8; color:#a8541f; }
    .icon-btn{ background:none; border:1px solid var(--line); border-radius:8px; padding:.35em .6em; cursor:pointer;
      font-family:var(--sans); font-size:.7rem; color:var(--ink-soft); }
    .icon-btn:hover{ border-color:var(--gold-deep); color:var(--gold-deep); }
    .icon-btn.danger:hover{ border-color:#c2492f; color:#c2492f; }
    /* editor */
    .ed-grid{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    @media (max-width:900px){ .ed-grid{ grid-template-columns:1fr; } }
    .preview-frame{ width:100%; height:420px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .seg{ display:flex; align-items:center; gap:.5rem; padding:.4rem 0; font-size:.95rem; cursor:pointer; }
    .seg input{ accent-color:var(--gold-deep); }
    .seg .sc{ color:var(--ink-soft); font-size:.85rem; }
    .pick-list{ max-height:240px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:.4rem .7rem; margin-top:.6rem; background:#fff; }
    .pick-row{ display:flex; align-items:center; gap:.6rem; padding:.3rem 0; font-size:.9rem; border-bottom:1px solid var(--line); }
    .pick-row:last-child{ border-bottom:none; }
    .tag-hint{ font-size:.8rem; color:var(--ink-soft); }
    .tag-hint code{ background:var(--cream); border:1px solid var(--line); border-radius:5px; padding:.05em .4em; font-size:.85em; }
  </style>
</head>
<body>
  <!-- Login / access gate -->
  <div class="gate" id="gate">
    <div class="gate-card">
      <div class="gate-banner"><img src="../assets/images/logo/logo-full-alpha.png" alt="Tiger Soul Retreats" /></div>
      <div class="gate-body">
        <h1 id="gateTitle">Admin Portal</h1>
        <p id="gateMsg">Private access for Tiger Soul facilitators.</p>
        <form id="magicForm">
          <input type="email" id="magicEmail" class="gate-input" placeholder="you@email.com" autocomplete="email" />
          <button class="btn" id="loginBtn" type="submit" style="width:100%;margin-top:.7rem;">Email me a login link</button>
        </form>
        <p class="sent" id="magicSent" style="display:none;"></p>
        <button class="btn btn--ghost" id="signoutBtnGate" style="display:none;margin-top:.8rem;">Sign out</button>
        <p class="err" id="gateErr"></p>
      </div>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <div class="topbar">
      <span class="brand">Tiger Soul · Admin Portal</span>
      <span class="who"><button class="btn btn--ghost" id="dashBtn">Dashboard</button><button class="btn btn--ghost" id="campBtn">Campaigns</button><span id="whoEmail"></span><button class="btn btn--ghost" id="signoutBtn">Sign out</button></span>
    </div>
    <div class="layout">
      <aside class="list" id="list">
        <div class="list-head">
          <input type="text" id="search" placeholder="Search name, email, phone…" />
          <span class="count" id="count"></span>
        </div>
        <div id="clients"></div>
      </aside>
      <main class="detail" id="detail">
        <p class="empty">Loading…</p>
      </main>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://werkohszkcytdvljafha.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndlcmtvaHN6a2N5dGR2bGphZmhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MzU5NjAsImV4cCI6MjA5OTAxMTk2MH0.dj_2mcPGvUGATnF7QoH3V4Q1sLq1XxxPv9N2B-paGQA";

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    let clients = [], activeId = null, waiverSet = new Set(), screenByP = {}, offerByP = {};
    let sessions = [], enrolls = [], progTablesReady = true;
    const PROGRAMS = ["The Liberation Program", "Bufo Practitioner Training", "Private Medicine Retreat", "Private Ceremony"];
    const fullName = (c) => ((c.first_name || "") + " " + (c.last_name || "")).trim() || (c.email || "—");
    const WAIVER_DOC = `<div style="font-size:.92rem;line-height:1.65;color:var(--ink-soft);">
      <p><em>Tiger Soul is a spiritual community. Our ceremonies are a spiritual practice, and the sacred medicines are sacraments of that belief. What we offer is not medical treatment, psychotherapy, or a substitute for professional care, and nothing here is medical advice.</em></p>
      <p><strong>1. The nature of the medicine.</strong> Bufo alvarius, the Sonoran Desert Toad, carries a secretion containing 5-MeO-DMT, a naturally occurring compound used for centuries in indigenous ceremony. It is received by smoking, with a rapid onset and a short journey of roughly 15 to 30 minutes. The medicine is ethically sourced from the Sonoran Desert through responsible practices that prioritize the well-being of the toads and environmental conservation.</p>
      <p><strong>2. Potential benefits.</strong> No two journeys are alike. Participants often describe a profound sense of unity and clarity, the release of emotional and mental weight carried for years, and a deep calm in the days that follow. These are spiritual and personal experiences, not medical outcomes, and we make no promise of any particular result.</p>
      <p><strong>3. Risks, and what to expect.</strong> 5-MeO-DMT is powerful and the experience can be physically and emotionally intense. Strong physical effects are common (raised heart rate, blood-pressure changes, purging, shaking, temporary loss of physical control); overwhelming emotional states can arise. It is not safe alongside certain medications (including SSRIs, MAOIs, and some psychiatric medications) or certain heart, blood-pressure, neurological, and mental-health conditions. No screening or preparation removes all risk.</p>
      <p><strong>4. Your medical screening and disclosures.</strong> Every participant completes the health and medical intake. By signing, you confirm the information is true and complete and that you have disclosed every medication, supplement, substance, and condition. We may decline or end anyone's participation, at any time, for safety.</p>
      <p><strong>5. Your facilitator.</strong> Tiger Soul is founded and led by Blaine Mueller, who holds every ceremony himself, trained in the Shipibo, Kambo, and Bufo lineages, with experience holding space for ancestral trauma, addiction, depression, PTSD, and physical suffering.</p>
      <p><strong>6. Physical and psychological safety.</strong> Everyone is screened and read personally; a one-to-one video call and preparation follow; careful attention is given to set, setting, and space; the facilitator stays present the entire time in a private, protected space with a harm-reduction approach; and you are asked to consult your physician beforehand.</p>
      <p><strong>7. Emergency response.</strong> In an emergency we assess, administer first aid within scope, and activate local emergency services; transport is arranged without delay and your emergency contact notified. You consent to us seeking emergency care on your behalf, and remain responsible for your own health, travel, and medical insurance.</p>
      <p><strong>8. Preparation and integration.</strong> You receive detailed preparation guidelines before arrival (nutrition, hydration, sleep, substance abstinence, medication review) and must follow them. Integration support is included afterward, as a group and one to one.</p>
      <p><strong>9. Voluntary participation.</strong> Participation is entirely voluntary. You may ask questions, decline the medicine, and withdraw at any point, for any reason.</p>
      <p><strong>10. Assumption of risk and waiver of liability.</strong> Having read and understood the above, I accept the risks and take part of my own free will and at my own responsibility. To the fullest extent permitted by law, I release and hold harmless Tiger Soul Medicine Retreats, its founder, facilitators, staff, hosts, and venues from any claim or liability for any injury, loss, or adverse outcome, except gross negligence or willful misconduct. Governed by the laws of the State of Quintana Roo, Mexico.</p>
      <p><strong>11. Confidentiality.</strong> Information shared is held in confidence; in return the participant agrees to protect the privacy of everyone else present.</p>
      <p><strong>12. Legal acknowledgment.</strong> The participant understands these medicines are received as spiritual sacraments within the community's practice and is responsible for the laws that apply to them.</p>
    </div>`;

    function showGate(title, msg, showSignout) {
      $("app").style.display = "none";
      $("gate").style.display = "flex";
      $("gateTitle").textContent = title;
      $("gateMsg").textContent = msg;
      $("magicForm").style.display = showSignout ? "none" : "";
      $("magicSent").style.display = "none";
      $("signoutBtnGate").style.display = showSignout ? "" : "none";
    }
    function showApp(email) {
      $("gate").style.display = "none";
      $("app").style.display = "block";
      $("whoEmail").textContent = email;
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return showGate("Admin Portal", "Private access for Tiger Soul facilitators.", false);
      let isAdmin = false;
      try { const { data } = await sb.rpc("is_admin"); isAdmin = !!data; } catch (_e) {}
      if (!isAdmin) return showGate("No access", (session.user.email || "This account") + " isn't on the facilitator list. Ask an admin to add you.", true);
      showApp(session.user.email);
      await loadAll();
    }

    sb.auth.onAuthStateChange(() => init());

    $("magicForm").onsubmit = async (e) => {
      e.preventDefault();
      const email = $("magicEmail").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("gateErr").textContent = "Please enter a valid email address."; return; }
      $("gateErr").textContent = "";
      $("loginBtn").disabled = true; $("loginBtn").textContent = "Sending…";
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + "/admin/" } });
      $("loginBtn").disabled = false; $("loginBtn").textContent = "Email me a login link";
      if (error) { $("gateErr").textContent = error.message; return; }
      $("magicForm").style.display = "none";
      $("magicSent").style.display = "";
      $("magicSent").textContent = "Check " + email + " for your one-time login link. It may take a moment to arrive.";
    };
    $("signoutBtn").onclick = $("signoutBtnGate").onclick = () => sb.auth.signOut();

    async function loadAll() {
      $("detail").innerHTML = '<p class="empty">Loading…</p>';
      const [p, w, s, ps, pe] = await Promise.all([
        sb.from("profiles").select("*"),
        sb.from("waivers").select("profile_id"),
        sb.from("screenings").select("profile_id, offering, created_at"),
        sb.from("program_sessions").select("*"),
        sb.from("program_enrollments").select("*"),
      ]);
      if (p.error) {
        const msg = 'Could not load data: ' + esc(p.error.message);
        $("clients").innerHTML = '<p class="empty" style="margin:2rem 1rem;">' + msg + '</p>';
        $("detail").innerHTML = '<p class="empty">' + msg + '</p>';
        return;
      }
      clients = (p.data || []).sort((a, b) => String(b.created_at || "").localeCompare(String(a.created_at || "")));
      waiverSet = new Set((w.data || []).map((r) => r.profile_id));
      screenByP = {}; offerByP = {};
      (s.data || []).forEach((r) => {
        screenByP[r.profile_id] = true;
        if (r.offering) offerByP[r.profile_id] = r.offering; // latest wins (ordered asc)
      });
      // Program dates + enrollment details live in their own tables (supabase/programs.sql).
      // If they haven't been created yet the portal still works, minus this section.
      progTablesReady = !ps.error && !pe.error;
      sessions = sortSessions(ps.data || []);
      enrolls = pe.data || [];
      renderList();
      renderDashboard();
      const wanted = new URLSearchParams(location.search).get("email");
      if (wanted) {
        const hit = clients.find((c) => (c.email || "").toLowerCase() === wanted.toLowerCase());
        if (hit) openProfile(hit.id);
      }
    }

    // ---- Program dates, rosters, and enrollment details ----------------------
    const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const PAY_LABELS = { unpaid: "Not started", deposit: "Deposit paid", paying: "Paying", paid: "Paid in full" };
    const ACC_LABELS = { shared: "Shared", private: "Private" };
    const sortSessions = (rows) => rows.slice().sort((a, b) => String(a.starts_on || "9999").localeCompare(String(b.starts_on || "9999")));
    const sessionsFor = (name) => sessions.filter((s) => s.program === name);
    const enrollFor = (pid, name) => enrolls.find((e) => e.profile_id === pid && e.program === name);

    function fmtDate(d) {
      const str = String(d || "").slice(0, 10);
      const [y, m, day] = str.split("-").map(Number);
      return y && m && day ? `${MON[m - 1]} ${day}, ${y}` : "";
    }
    function fmtRange(a, b) {
      a = String(a || "").slice(0, 10); b = String(b || "").slice(0, 10);
      if (!a && !b) return "Dates not set";
      if (!a) return fmtDate(b);
      if (!b || b === a) return fmtDate(a);
      const [ya, ma, da] = a.split("-"), [yb, mb, db] = b.split("-");
      if (ya === yb && ma === mb) return `${MON[+ma - 1]} ${+da}–${+db}, ${ya}`;
      if (ya === yb) return `${MON[+ma - 1]} ${+da} – ${MON[+mb - 1]} ${+db}, ${ya}`;
      return `${fmtDate(a)} – ${fmtDate(b)}`;
    }
    const sessLabel = (s) => `${fmtRange(s.starts_on, s.ends_on)}${s.label ? " · " + s.label : ""}${s.location ? " · " + s.location : ""}`;

    // Someone is in a program if their intake named it, or we added them by hand.
    function rosterFor(name) {
      const seen = new Set(), out = [];
      clients.forEach((c) => { if (offerByP[c.id] === name) { seen.add(c.id); out.push(c); } });
      enrolls.filter((e) => e.program === name).forEach((e) => {
        if (seen.has(e.profile_id)) return;
        const c = clients.find((x) => x.id === e.profile_id);
        if (c) { seen.add(c.id); out.push(c); }
      });
      return out.sort((a, b) => fullName(a).localeCompare(fullName(b)));
    }

    function computeDash() {
      const byProgram = {};
      PROGRAMS.forEach((p) => byProgram[p] = rosterFor(p));
      clients.forEach((c) => { const off = offerByP[c.id]; if (off && !byProgram[off]) byProgram[off] = rosterFor(off); });
      const enrolled = clients.filter((c) => offerByP[c.id] && waiverSet.has(c.id));
      const missing = clients.filter((c) => !waiverSet.has(c.id) || !screenByP[c.id] || !c.phone);
      const programsWithPeople = Object.keys(byProgram).filter((k) => byProgram[k].length).length;
      return { byProgram, enrolled, missing, programsWithPeople };
    }
    const progTag = (c) => offerByP[c.id] ? `<span class="mtag" style="background:#e9efe6;color:#3c5a3c;">${esc(offerByP[c.id])}</span>` : "";
    function peopleList(people, extra) {
      if (!people.length) return '<p class="muted">No one here yet.</p>';
      return '<div class="miss-list">' + people.map((c) =>
        `<button class="miss-row" data-id="${c.id}"><span class="nm">${esc(fullName(c))}</span>
          <span>${extra ? extra(c) : ""}<span class="muted" style="font-size:.82rem;margin-left:.6rem;">${esc(c.email || "")}</span></span></button>`).join("") + '</div>';
    }
    function programCardsHtml(byProgram) {
      return Object.keys(byProgram).map((name) => {
        const people = byProgram[name];
        const ss = sessionsFor(name);
        const dates = ss.length
          ? `<div class="prog-dates">${ss.map((s) => `<span>${esc(sessLabel(s))}</span>`).join("")}</div>`
          : '<div class="prog-dates">No dates set yet</div>';
        const chips = people.length
          ? `<div class="chips">${people.map((pr) => `<button class="chip" data-id="${pr.id}">${esc(fullName(pr))}</button>`).join("")}</div>`
          : '<span class="muted">No one enrolled yet.</span>';
        return `<div class="prog-card click" data-prog="${esc(name)}"><div class="prog-name">${esc(name)}</div>
          <div class="prog-count">${people.length} ${people.length === 1 ? "person" : "people"}</div>
          ${dates}${chips}<span class="prog-open">Open roster &rarr;</span></div>`;
      }).join("");
    }

    // ---- One program: its dates and everyone in it ---------------------------
    async function showProgram(name) {
      activeId = null; renderList();
      $("detail").innerHTML = `
        <span class="back" id="backDash">&larr; Dashboard</span>
        <h1 class="dash-head" style="margin-bottom:.2rem;">${esc(name)}</h1>
        <div id="progHead"></div>
        ${progTablesReady ? "" : '<p class="muted">Dates and enrollment details need the <code>program_sessions</code> and <code>program_enrollments</code> tables. Run <code>supabase/programs.sql</code> in Supabase, then reload.</p>'}
        <div class="card" id="sessCard" style="display:none;"><h3>Edit dates</h3><div id="sessBox"></div></div>
        <h2 class="dash-h">People <span class="muted" style="font-size:.9rem;" id="rosterCount"></span></h2>
        <div id="rosterBox"><p class="muted">Loading…</p></div>
        <div class="card" id="addBox"></div>`;
      $("backDash").onclick = renderDashboard;
      renderProgHead(name);
      renderSessions(name);
      await renderRoster(name);
    }

    // The program's dates, sitting right under its title.
    function renderProgHead(name) {
      const ss = sessionsFor(name);
      const editing = $("sessCard") && $("sessCard").style.display !== "none";
      $("progHead").innerHTML = `
        <p class="prog-head-dates">${ss.length ? ss.map((s) => esc(sessLabel(s))).join("<br>") : "No dates set yet"}</p>
        <button class="icon-btn" id="editSess">${editing ? "Done" : ss.length ? "Edit dates" : "Add dates"}</button>`;
      $("editSess").onclick = () => {
        const card = $("sessCard");
        const open = card.style.display !== "none";
        card.style.display = open ? "none" : "";
        $("editSess").textContent = open ? (sessionsFor(name).length ? "Edit dates" : "Add dates") : "Done";
        if (!open) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
    }

    function renderSessions(name) {
      const ss = sessionsFor(name);
      const rows = ss.length ? ss.map((s) => `
        <div class="date-row" data-sid="${s.id}">
          <div class="fld"><label>Starts</label><input type="date" data-sf="starts_on" value="${esc((s.starts_on || "").slice(0, 10))}" /></div>
          <div class="fld"><label>Ends</label><input type="date" data-sf="ends_on" value="${esc((s.ends_on || "").slice(0, 10))}" /></div>
          <div class="fld"><label>Label</label><input data-sf="label" value="${esc(s.label || "")}" placeholder="e.g. Cohort 2" /></div>
          <div class="fld"><label>Location</label><input data-sf="location" value="${esc(s.location || "")}" placeholder="Tulum, Mexico" /></div>
          <button class="icon-btn danger" data-delsess="${s.id}">Remove</button>
        </div>`).join("") : '<p class="muted">No dates yet. Add the first one below.</p>';
      $("sessBox").innerHTML = rows +
        `<div class="rec-actions"><button class="btn" id="addSess">+ Add dates</button><span class="flash" id="sessFlash"></span></div>`;

      const flash = (msg, bad) => { const el = $("sessFlash"); el.className = "flash" + (bad ? " bad" : ""); el.textContent = msg; if (!bad) setTimeout(() => el.textContent = "", 2000); };
      $("sessBox").querySelectorAll(".date-row").forEach((row) => {
        row.querySelectorAll("[data-sf]").forEach((inp) => inp.onchange = async () => {
          const patch = { [inp.dataset.sf]: inp.value || null };
          const { error } = await sb.from("program_sessions").update(patch).eq("id", row.dataset.sid);
          if (error) return flash("Could not save: " + error.message, true);
          const s = sessions.find((x) => x.id === row.dataset.sid);
          if (s) Object.assign(s, patch);
          sessions = sortSessions(sessions);
          flash("Saved.");
          renderProgHead(name);   // the line under the title follows along
        });
      });
      $("sessBox").querySelectorAll("[data-delsess]").forEach((b) => b.onclick = async () => {
        if (!confirm("Remove these dates from this program?")) return;
        const { error } = await sb.from("program_sessions").delete().eq("id", b.dataset.delsess);
        if (error) return flash("Could not remove: " + error.message, true);
        sessions = sessions.filter((x) => x.id !== b.dataset.delsess);
        renderSessions(name); renderProgHead(name);
      });
      $("addSess").onclick = async () => {
        const { data, error } = await sb.from("program_sessions").insert({ program: name }).select().single();
        if (error) return flash("Could not add: " + error.message, true);
        sessions = sortSessions(sessions.concat(data));
        renderSessions(name); renderProgHead(name);
      };
    }

    async function renderRoster(name) {
      const people = rosterFor(name);
      $("rosterCount").textContent = people.length ? `· ${people.length} ${people.length === 1 ? "person" : "people"}` : "";

      // What they answered about accommodation on their intake, as a starting hint.
      const accHint = {};
      if (people.length) {
        const { data } = await sb.from("screenings").select("profile_id, answers, created_at")
          .in("profile_id", people.map((c) => c.id)).order("created_at", { ascending: true });
        (data || []).forEach((r) => {
          const a = (Array.isArray(r.answers) ? r.answers : []).find((x) => /private accommodation/i.test(x.question || ""));
          if (a && a.answer) accHint[r.profile_id] = a.answer;
        });
      }

      $("rosterBox").innerHTML = people.length
        ? people.map((c) => rosterRowHtml(c, name, accHint[c.id])).join("")
        : '<p class="muted">No one in this program yet.</p>';
      wireRoster(name);
      renderAddBox(name, people);
    }

    function rosterRowHtml(c, name, hint) {
      const e = enrollFor(c.id, name) || {};
      const opt = (v, label, cur) => `<option value="${esc(v)}" ${cur === v ? "selected" : ""}>${esc(label)}</option>`;
      const accOpts = `<option value="" ${!e.accommodation ? "selected" : ""}>— Not set —</option>` +
        opt("shared", "Shared", e.accommodation) + opt("private", "Private", e.accommodation);
      const payOpts = `<option value="" ${!e.payment_status ? "selected" : ""}>— Not set —</option>` +
        Object.keys(PAY_LABELS).map((k) => opt(k, PAY_LABELS[k], e.payment_status)).join("");
      const hintHtml = !e.accommodation && hint ? ` <span class="hint">intake said ${esc(hint)}</span>` : "";
      const fromIntake = offerByP[c.id] === name;
      return `
        <div class="ro" data-pid="${c.id}">
          <div class="ro-top">
            <div>
              <span class="ro-name" data-id="${c.id}">${esc(fullName(c))}</span>
              <div class="ro-mail">${esc(c.email || "")}${c.phone ? " · " + esc(c.phone) : ""}</div>
            </div>
            <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
              <span class="badge ${waiverSet.has(c.id) ? "badge--ok" : "badge--no"}">${waiverSet.has(c.id) ? "Waiver signed" : "No waiver"}</span>
              <span class="badge ${screenByP[c.id] ? "badge--ok" : "badge--no"}">${screenByP[c.id] ? "Intake done" : "No intake"}</span>
            </div>
          </div>
          <div class="ro-grid">
            <div class="fld"><label>Accommodation${hintHtml}</label><select data-f="accommodation">${accOpts}</select></div>
            <div class="fld"><label>Payment plan</label><input data-f="payment_plan" value="${esc(e.payment_plan || "")}" placeholder="e.g. 3 × $1,500 monthly" /></div>
            <div class="fld"><label>Payment link</label><input data-f="payment_link" value="${esc(e.payment_link || "")}" placeholder="https://buy.stripe.com/…" /></div>
          </div>
          <div class="ro-foot">
            <div class="fld" style="max-width:200px;"><label>Payment status</label><select data-f="payment_status">${payOpts}</select></div>
            ${e.payment_link ? `<a class="btn btn--ghost" href="${esc(e.payment_link)}" target="_blank" rel="noopener">Open link</a>
              <button class="icon-btn" data-copy="${esc(e.payment_link)}">Copy link</button>` : ""}
            ${fromIntake ? '<span class="flash" style="color:var(--ink-soft);">In this program from their intake form</span>'
              : `<button class="icon-btn danger" data-remove="${c.id}">Remove from program</button>`}
            <span class="flash" data-flash></span>
          </div>
        </div>`;
    }

    // Write one field of someone's enrollment, creating the row the first time.
    async function saveEnroll(pid, program, patch) {
      const cur = enrollFor(pid, program);
      if (cur) {
        const { data, error } = await sb.from("program_enrollments")
          .update({ ...patch, updated_at: new Date().toISOString() }).eq("id", cur.id).select().single();
        if (error) return error;
        Object.assign(cur, data);
      } else {
        const { data, error } = await sb.from("program_enrollments")
          .insert({ profile_id: pid, program, ...patch }).select().single();
        if (error) return error;
        enrolls.push(data);
      }
      return null;
    }

    function wireRoster(name) {
      $("rosterBox").querySelectorAll(".ro").forEach((row) => {
        const pid = row.dataset.pid;
        const flashEl = row.querySelector("[data-flash]");
        const flash = (msg, bad) => { flashEl.className = "flash" + (bad ? " bad" : ""); flashEl.textContent = msg; if (!bad) setTimeout(() => flashEl.textContent = "", 2000); };
        row.querySelectorAll("[data-f]").forEach((inp) => inp.onchange = async () => {
          const err = await saveEnroll(pid, name, { [inp.dataset.f]: inp.value || null });
          if (err) return flash("Could not save: " + err.message, true);
          if (inp.dataset.f === "payment_link") return renderRoster(name);  // refresh the Open/Copy buttons
          flash("Saved.");
        });
        row.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
          try { await navigator.clipboard.writeText(b.dataset.copy); flash("Link copied."); }
          catch (_e) { flash("Couldn't copy — select the link and copy it.", true); }
        });
        row.querySelectorAll("[data-remove]").forEach((b) => b.onclick = async () => {
          if (!confirm("Remove this person from the program? Their waiver and intake stay on file.")) return;
          const cur = enrollFor(pid, name);
          if (cur) {
            const { error } = await sb.from("program_enrollments").delete().eq("id", cur.id);
            if (error) return flash("Could not remove: " + error.message, true);
            enrolls = enrolls.filter((x) => x.id !== cur.id);
          }
          renderRoster(name);
        });
        row.querySelectorAll("[data-id]").forEach((el) => el.onclick = () => openProfile(el.dataset.id));
      });
    }

    function renderAddBox(name, people) {
      const inRoster = new Set(people.map((c) => c.id));
      const others = clients.filter((c) => !inRoster.has(c.id));
      $("addBox").innerHTML = `
        <h3>Add someone to this program</h3>
        <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;">
          <select id="addWho" class="camp-input" style="max-width:360px;">
            ${others.map((c) => `<option value="${c.id}">${esc(fullName(c))}${c.email ? " — " + esc(c.email) : ""}</option>`).join("")}
          </select>
          <button class="btn" id="addWhoBtn" ${others.length ? "" : "disabled"}>Add</button>
          <span class="flash" id="addFlash"></span>
        </div>`;
      $("addWhoBtn").onclick = async () => {
        const pid = $("addWho").value;
        if (!pid) return;
        const err = await saveEnroll(pid, name, {});
        if (err) { const f = $("addFlash"); f.className = "flash bad"; f.textContent = "Could not add: " + err.message; return; }
        renderRoster(name);
      };
    }
    function missListHtml(missing) {
      if (!missing.length) return '<p class="muted">Everyone\'s records are complete.</p>';
      return '<div class="miss-list">' + missing.map((c) => {
        const tags = [];
        if (!waiverSet.has(c.id)) tags.push('<span class="mtag">No waiver</span>');
        if (!screenByP[c.id]) tags.push('<span class="mtag">No intake</span>');
        if (!c.phone) tags.push('<span class="mtag">No phone</span>');
        return `<button class="miss-row" data-id="${c.id}"><span class="nm">${esc(fullName(c))}</span><span>${tags.join("")}</span></button>`;
      }).join("") + '</div>';
    }
    function wireDetail() {
      $("detail").querySelectorAll("[data-id]").forEach((el) => el.onclick = (e) => { e.stopPropagation(); openProfile(el.dataset.id); });
      $("detail").querySelectorAll("[data-prog]").forEach((el) => el.onclick = () => showProgram(el.dataset.prog));
    }

    function showView(title, bodyHtml) {
      activeId = null; renderList();
      $("detail").innerHTML = `<span class="back" id="backDash">&larr; Dashboard</span><h1 class="dash-head">${esc(title)}</h1>${bodyHtml}`;
      $("backDash").onclick = renderDashboard;
      wireDetail();
    }

    function renderDashboard() {
      activeId = null; renderList();
      const D = computeDash();
      const tile = (id, num, lbl, warn) => `<div class="tile ${warn && num ? "warn" : ""}" id="${id}"><div class="tnum">${num}</div><div class="tlbl">${lbl}</div></div>`;
      $("detail").innerHTML = `
        <h1 class="dash-head">Dashboard</h1>
        <div class="tiles">
          ${tile("tileClients", clients.length, "Clients")}
          ${tile("tilePrograms", D.programsWithPeople, "Active programs")}
          ${tile("tileEnrolled", D.enrolled.length, "Currently enrolled")}
          ${tile("tileMissing", D.missing.length, "Missing information", true)}
        </div>
        <h2 class="dash-h">Active programs</h2>
        <div class="prog-grid">${programCardsHtml(D.byProgram)}</div>
        <h2 class="dash-h">Missing information</h2>
        ${missListHtml(D.missing)}`;
      wireDetail();
      $("tileClients").onclick  = () => showView("Clients", peopleList(clients, progTag));
      $("tilePrograms").onclick = () => showView("Active programs", `<div class="prog-grid">${programCardsHtml(D.byProgram)}</div>`);
      $("tileEnrolled").onclick = () => showView("Currently enrolled", peopleList(D.enrolled, progTag));
      $("tileMissing").onclick  = () => showView("Missing information", missListHtml(D.missing));
    }
    $("dashBtn").onclick = renderDashboard;

    // ================= Campaigns (a small campaign manager) =================
    const emailable = () => clients.filter((c) => c.email && !c.unsubscribed_at);
    let campaigns = [], editing = null;
    const AUD_LABELS = { all: "All clients", program: "By program interest", no_intake: "No intake on file", handpick: "Hand-picked" };

    // How many emailable clients a given audience resolves to (client-side estimate).
    function audienceCount(a) {
      const base = emailable();
      if (a.audience_type === "program") return base.filter((c) => offerByP[c.id] === a.audience_program).length;
      if (a.audience_type === "no_intake") return base.filter((c) => !screenByP[c.id]).length;
      if (a.audience_type === "handpick") { const set = new Set(a.audience_ids || []); return base.filter((c) => set.has(c.id)).length; }
      return base.length;
    }
    const audienceSummary = (a) => `${AUD_LABELS[a.audience_type] || "All clients"}${a.audience_type === "program" && a.audience_program ? " · " + a.audience_program : ""} · ${audienceCount(a)} recipients`;

    async function renderCampaigns() {
      activeId = null; renderList();
      $("detail").innerHTML = `
        <div class="dash-head-row">
          <h1 class="dash-head">Campaigns</h1>
          <button class="btn" id="newCampBtn">+ New campaign</button>
        </div>
        <div id="campList"><p class="muted">Loading…</p></div>`;
      $("newCampBtn").onclick = newCampaign;
      const { data, error } = await sb.from("campaigns").select("*").order("updated_at", { ascending: false });
      const box = $("campList");
      if (error) { box.innerHTML = `<p class="muted">Couldn't load campaigns: ${esc(error.message)}</p>`; return; }
      campaigns = data || [];
      if (!campaigns.length) { box.innerHTML = '<p class="muted">No campaigns yet. Click “New campaign” to build your first newsletter.</p>'; return; }
      box.innerHTML = campaigns.map((c) => {
        const when = c.status === "sent" ? `Sent ${(c.sent_at || "").slice(0, 10)} · ${c.recipient_count} recipients`
          : c.status === "scheduled" ? `Scheduled for ${(c.scheduled_at || "").slice(0, 16).replace("T", " ")}`
          : `Draft · edited ${(c.updated_at || "").slice(0, 10)}`;

          <div class="cright">
            <span class="st st--${c.status}">${c.status}</span>
            <button class="icon-btn" data-dup="${c.id}">Duplicate</button>
            <button class="icon-btn danger" data-del="${c.id}">Delete</button>
          </div></div>`;
      }).join("");
      box.querySelectorAll("[data-open]").forEach((el) => el.onclick = (e) => { if (e.target.dataset.dup || e.target.dataset.del) return; openCampaign(el.dataset.open); });
      box.querySelectorAll("[data-dup]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); duplicateCampaign(b.dataset.dup); });
      box.querySelectorAll("[data-del]").forEach((b) => b.onclick = (e) => { e.stopPropagation(); deleteCampaign(b.dataset.del); });
    }

    function newCampaign() {
      editing = { id: null, name: "Untitled campaign", subject: "", preview_text: "", content_html: "",
        audience_type: "all", audience_program: PROGRAMS[0], audience_ids: [], status: "draft", scheduled_at: null };
      renderEditor();
    }
    function openCampaign(id) {
      const c = campaigns.find((x) => x.id === id);
      if (!c) return;
      editing = { ...c, audience_ids: c.audience_ids || [], audience_program: c.audience_program || PROGRAMS[0] };
      renderEditor();
    }
    async function duplicateCampaign(id) {
      const c = campaigns.find((x) => x.id === id); if (!c) return;
      const copy = { name: (c.name || "Untitled") + " (copy)", subject: c.subject, preview_text: c.preview_text,
        content_html: c.content_html, audience_type: c.audience_type, audience_program: c.audience_program,
        audience_ids: c.audience_ids || [], status: "draft", updated_at: new Date().toISOString() };
      const { error } = await sb.from("campaigns").insert(copy);
      if (error) return alert("Could not duplicate: " + error.message);
      renderCampaigns();
    }
    async function deleteCampaign(id) {
      const c = campaigns.find((x) => x.id === id);
      if (!confirm(`Delete “${c ? c.name : "this campaign"}”? This can't be undone.`)) return;
      const { error } = await sb.from("campaigns").delete().eq("id", id);
      if (error) return alert("Could not delete: " + error.message);
      renderCampaigns();
    }

          <div class="ed-grid">
            <textarea id="edHtml" style="min-height:420px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;" placeholder="<html>… paste your email here …</html>">${esc(e.content_html || "")}</textarea>

          <label class="seg"><input type="radio" name="aud" value="no_intake" ${e.audience_type === "no_intake" ? "checked" : ""}/> <span>No intake on file</span> <span class="sc" id="scNo"></span></label>
          <label class="seg"><input type="radio" name="aud" value="handpick" ${e.audience_type === "handpick" ? "checked" : ""}/> <span>Hand-pick clients</span> <span class="sc" id="scPick"></span></label>
          <div id="pickWrap" style="display:${e.audience_type === "handpick" ? "block" : "none"};">
            <input type="text" id="pickSearch" class="camp-input" placeholder="Search to add…" style="margin-top:.6rem;" />
            <div class="pick-list" id="pickList"></div>
          </div>
          <p class="camp-note" id="audCount" style="margin-top:.8rem;"></p>
        </div>

        <div class="card">
          <div class="camp-actions">
            <button class="btn btn--ghost" id="edSaveDraft">Save draft</button>

            <button class="btn" id="edSendNow" ${sent ? "disabled" : ""}>Send now</button>
            <span class="camp-status" id="edStatus"></span>

            <span class="lbl" style="margin:0;">Or schedule:</span>
            <input type="datetime-local" id="edSchedule" class="camp-input" style="width:auto;" value="${e.scheduled_at ? new Date(e.scheduled_at).toISOString().slice(0, 16) : ""}" />
            <button class="btn btn--ghost" id="edScheduleBtn" ${sent ? "disabled" : ""}>Schedule send</button>
          </div>

      $("backCamps").onclick = renderCampaigns;
      const frame = $("edPreviewFrame");
      const refreshPreview = () => { frame.srcdoc = ($("edHtml").value || "<p style='font-family:sans-serif;color:#999;padding:20px;'>Preview appears here.</p>")
        .replaceAll("{{first_name}}", "Friend").replaceAll("{{last_name}}", "").replaceAll("{{email}}", "you@example.com").replaceAll("{{unsubscribe_url}}", "#"); };
      $("edHtml").oninput = () => { editing.content_html = $("edHtml").value; refreshPreview(); };
      refreshPreview();

      $("edName").oninput = () => editing.name = $("edName").value;
      $("edSubject").oninput = () => editing.subject = $("edSubject").value;

      $("edProgram").onchange = () => { editing.audience_program = $("edProgram").value; updateAudienceUI(); };
      document.getElementsByName("aud").forEach((r) => r.onchange = () => {
        editing.audience_type = document.querySelector('input[name="aud"]:checked').value;
        $("pickWrap").style.display = editing.audience_type === "handpick" ? "block" : "none";
        updateAudienceUI();
      });
      $("pickSearch").oninput = renderPickList;
      renderPickList();
      updateAudienceUI();

      $("edSaveDraft").onclick = () => saveCampaign({ toast: true });
      $("edTest").onclick = sendTest;
      $("edSendNow").onclick = sendNow;
      $("edScheduleBtn").onclick = scheduleSend;

    function updateAudienceUI() {
      const base = emailable();
      $("scAll").textContent = base.length + " people";
      $("scProg").textContent = base.filter((c) => offerByP[c.id] === editing.audience_program).length + " people";
      $("scNo").textContent = base.filter((c) => !screenByP[c.id]).length + " people";
      const set = new Set(editing.audience_ids || []);
      $("scPick").textContent = base.filter((c) => set.has(c.id)).length + " selected";
      $("audCount").innerHTML = `This campaign will send to <strong>${audienceCount(editing)}</strong> ${audienceCount(editing) === 1 ? "client" : "clients"}. Each gets their own copy — recipients never see each other. Unsubscribed clients are always skipped.`;
    }

    function renderPickList() {
      const list = $("pickList"); if (!list) return;
      const q = ($("pickSearch").value || "").trim().toLowerCase();
      const set = new Set(editing.audience_ids || []);
      const rows = emailable().filter((c) => !q || [c.first_name, c.last_name, c.email].join(" ").toLowerCase().includes(q));
      list.innerHTML = rows.slice(0, 200).map((c) => `<label class="pick-row">
        <input type="checkbox" data-pid="${c.id}" ${set.has(c.id) ? "checked" : ""}/>
        <span>${esc(fullName(c))}</span><span class="muted" style="font-size:.8rem;">${esc(c.email)}</span></label>`).join("")
        || '<p class="muted" style="padding:.4rem 0;">No matches.</p>';
      list.querySelectorAll("[data-pid]").forEach((cb) => cb.onchange = () => {
        const ids = new Set(editing.audience_ids || []);
        cb.checked ? ids.add(cb.dataset.pid) : ids.delete(cb.dataset.pid);
        editing.audience_ids = [...ids];
        updateAudienceUI();
      });

    async function saveCampaign({ toast } = {}) {
      const row = {
        name: editing.name || "Untitled campaign", subject: editing.subject || "", preview_text: editing.preview_text || "",
        content_html: editing.content_html || "", audience_type: editing.audience_type,
        audience_program: editing.audience_type === "program" ? editing.audience_program : null,
        audience_ids: editing.audience_type === "handpick" ? (editing.audience_ids || []) : [],
        updated_at: new Date().toISOString(),
      };
      let res;
      if (editing.id) res = await sb.from("campaigns").update(row).eq("id", editing.id).select().single();
      else res = await sb.from("campaigns").insert({ ...row, status: "draft" }).select().single();
      if (res.error) { setEdStatus("bad", "Could not save: " + res.error.message); return null; }
      editing.id = res.data.id; editing.status = res.data.status;
      if (toast) setEdStatus("ok", "Saved.");
      return res.data;
    }

    function setEdStatus(kind, msg) { const s = $("edStatus"); if (!s) return; s.className = "camp-status " + kind; s.textContent = msg; }

    async function callSend(payload) {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/send-campaign`, {
        method: "POST",
        headers: { "content-type": "application/json", Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify(payload),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(out.error || `Failed (${res.status})`);
      return out;
    }

    async function sendTest() {
      if (!editing.subject) return setEdStatus("bad", "Add a subject first.");
      if (!(editing.content_html || "").trim()) return setEdStatus("bad", "Paste your email HTML first.");
      setEdStatus("", "Sending test…");
      try {
        await callSend({ test: true, subject: editing.subject, contentHtml: editing.content_html, previewText: editing.preview_text });
        setEdStatus("ok", "Test sent to you. Check your inbox.");
      } catch (err) { setEdStatus("bad", "Couldn't send test: " + (err.message || err)); }
    }

    async function sendNow() {
      if (!editing.subject) return setEdStatus("bad", "Add a subject first.");
      if (!(editing.content_html || "").trim()) return setEdStatus("bad", "Paste your email HTML first.");
      const n = audienceCount(editing);
      if (!n) return setEdStatus("bad", "This audience has no recipients.");
      if (!confirm(`Send “${editing.name}” to ${n} client${n === 1 ? "" : "s"} now? This can't be undone.`)) return;
      $("edSendNow").disabled = true; setEdStatus("", "Saving…");
      try {
        const saved = await saveCampaign({}); if (!saved) throw new Error("Save failed");
        setEdStatus("", "Sending…");
        const out = await callSend({ campaignId: editing.id });
        setEdStatus("ok", `Sent to ${out.sent} client${out.sent === 1 ? "" : "s"}.${out.failed ? ` ${out.failed} failed.` : ""}`);
        setTimeout(renderCampaigns, 1200);
      } catch (err) { setEdStatus("bad", "Couldn't send: " + (err.message || err)); $("edSendNow").disabled = false; }
    }

    async function scheduleSend() {
      const val = $("edSchedule").value;
      if (!val) return setEdStatus("bad", "Pick a date and time first.");
      if (!editing.subject || !(editing.content_html || "").trim()) return setEdStatus("bad", "Add a subject and email HTML first.");
      const when = new Date(val);
      if (when.getTime() < Date.now()) return setEdStatus("bad", "Pick a time in the future.");
      try {
        await saveCampaign({});
        const { error } = await sb.from("campaigns").update({ status: "scheduled", scheduled_at: when.toISOString() }).eq("id", editing.id);
        if (error) throw error;
        setEdStatus("ok", `Scheduled for ${when.toLocaleString()}.`);
        setTimeout(renderCampaigns, 1200);
      } catch (err) { setEdStatus("bad", "Couldn't schedule: " + (err.message || err)); }
    }

    $("campBtn").onclick = renderCampaigns;

    function renderList() {
      const q = $("search").value.trim().toLowerCase();
      const rows = clients.filter((c) =>
        !q || [c.first_name, c.last_name, c.email, c.phone].join(" ").toLowerCase().includes(q));
      $("count").textContent = rows.length + (rows.length === 1 ? " client" : " clients");
      $("clients").innerHTML = rows.map((c) => `
        <div class="client ${c.id === activeId ? "active" : ""}" data-id="${c.id}">
          <div class="nm">${esc(((c.first_name || "") + " " + (c.last_name || "")).trim() || "—")}</div>
          <div class="em">${esc(c.email || "")}${c.phone ? " · " + esc(c.phone) : ""}</div>
        </div>`).join("") || '<p class="empty" style="margin:2rem 1rem;">No clients yet.</p>';
      document.querySelectorAll(".client").forEach((el) => el.onclick = () => openProfile(el.dataset.id));

    $("search").oninput = renderList;

      };
    }

    function openPrint(title, bodyHtml) {
      const win = window.open("", "_blank");
      if (!win) { alert("Please allow pop-ups so the copy can open."); return; }
      win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
        <style>
          body{ font-family:Georgia,'Times New Roman',serif; color:#20201a; max-width:720px; margin:26px auto; padding:0 22px; line-height:1.6; }
          h1{ font-size:22px; color:#1c2b22; margin:0 0 2px; }
          .meta{ font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#8a6d2b; margin-bottom:18px; }
          .kv b{ display:inline-block; min-width:140px; color:#8a6d2b; font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
          .kv{ margin:12px 0; line-height:2; }
          .sig{ max-width:320px; border:1px solid #ddd; border-radius:6px; margin-top:6px; }
          .q{ font-size:12px; color:#666; margin-top:12px; } .a{ font-size:15px; }
          hr{ border:none; border-top:1px solid #ddd; margin:18px 0; }
          p{ margin:8px 0; } @media print { body{ margin:0; } }
        </style></head><body>${bodyHtml}</body></html>`);
      win.document.close(); win.focus();
      setTimeout(() => win.print(), 400);
    }
    async function printWaiver(c, w) {
      if (!w) return;
      const dateStr = w.date_signed || (w.signed_at || "").slice(0, 10) || "—";

      // Pull the live waiver page so the copy is visually identical to what
      // they signed (same banner, logo, fonts, and section text).
      let styleHtml = "", bannerHtml = "", docHtml = "";
      try {
        const parsed = new DOMParser().parseFromString(await (await fetch("/waiver/")).text(), "text/html");
        styleHtml = [...parsed.querySelectorAll("style")].map((s) => s.outerHTML).join("");
        bannerHtml = (parsed.querySelector(".wv-banner") || {}).outerHTML || "";
        const wvDoc = parsed.getElementById("wvDoc");
        if (wvDoc) { const f = wvDoc.querySelector("#waiverForm"); if (f) f.remove(); docHtml = wvDoc.innerHTML; }
      } catch (e) { /* fall back below */ }
      if (!docHtml) docHtml = WAIVER_DOC;

      const sigBlock = `
        <hr style="border:none;border-top:1px solid #e7e0d0;margin:1.8rem 0 1.2rem;">
        <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:#203829;font-size:1.5rem;margin:0 0 .5rem;">Signature</h2>
        <p style="font-family:'Jost',Arial,sans-serif;font-size:.95rem;color:#232219;line-height:1.7;">
          <strong>Signed by:</strong> ${esc(fullName(c))} &nbsp;·&nbsp; ${esc(c.email || "")}${c.phone ? " &nbsp;·&nbsp; " + esc(c.phone) : ""}<br>
          <strong>Date signed:</strong> ${esc(dateStr)} &nbsp;·&nbsp; <strong>Timestamp:</strong> ${esc(w.signed_at || "")}
        </p>
        ${w.signature ? `<img src="${esc(w.signature)}" style="max-width:340px;border:1px solid #e7e0d0;border-radius:8px;background:#fff;">` : "<p>(no signature stored)</p>"}
        <p style="font-family:Georgia,serif;color:#232219;margin-top:.4rem;">${esc(fullName(c))} — ${esc(dateStr)}</p>`;

      const win = window.open("", "_blank");
      if (!win) { alert("Please allow pop-ups so the signed copy can open."); return; }
      win.document.write(`<!doctype html><html><head><meta charset="utf-8">
        <base href="${location.origin}/waiver/">
        <title>Signed Waiver — ${esc(fullName(c))}</title>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
        ${styleHtml}
        <style>html,body{background:#fff;margin:0;} .wv-form,form#waiverForm{display:none!important;} @media print{ .sheet{box-shadow:none;} }</style>
        </head><body>
        <div class="sheet">${bannerHtml}<div class="wv-body">${docHtml}${sigBlock}</div></div>
        </body></html>`);
      win.document.close(); win.focus();
      setTimeout(() => win.print(), 700);
    }
    function printIntake(c, s) {
      if (!s) return;
      const ans = Array.isArray(s.answers) ? s.answers : [];
      const rows = ans.map((a) => `<div class="q">${esc(a.question)}</div><div class="a">${a.answer ? esc(a.answer) : "— not answered —"}</div>`).join("");
      openPrint("Medical Intake — " + fullName(c), `
        <h1>Medical &amp; Health Intake</h1>
        <div class="meta">Tiger Soul Medicine Retreats</div>
        <div class="kv"><b>Completed by</b> ${esc(fullName(c))}<br><b>Email</b> ${esc(c.email || "")}<br><b>Phone</b> ${esc(c.phone || "")}<br><b>Program</b> ${esc(s.offering || "")}<br><b>Date completed</b> ${esc((s.created_at || "").slice(0, 10))}</div>
        <hr>${rows}`);
    }

    init();
  </script>
</body>
</html>
